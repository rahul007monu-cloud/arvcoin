name: Build Web3Auth Wallet Bundle

# Web3Auth SDK ko GitHub ke server pe bundle karke wallet-bundle.js
# repo me commit karta hai — user ko kuch install/run nahi karna padta.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "web3auth-build/**"
      - ".github/workflows/build-wallet.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: web3auth-build
        run: npm install --no-audit --no-fund

      - name: Build wallet bundle
        working-directory: web3auth-build
        run: npm run build

      - name: Show output
        run: ls -lh wallet-bundle.js

      - name: Commit bundle back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wallet-bundle.js
          if git diff --staged --quiet; then
            echo "No change in wallet-bundle.js"
          else
            git commit -m "chore: build real Web3Auth wallet bundle [skip ci]"
            git push
          fi
