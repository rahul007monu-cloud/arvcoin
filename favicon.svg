<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ARV Coin">
  <!--
    Sterling mark: a milled silver plate carrying the letter A.

    Designed for 16px first. At that size a helix, a chart or a coin edge all
    collapse into grey mush, so the mark is one letterform with enough weight to
    survive being three pixels wide — everything else is material, and material
    reads at any size.
  -->
  <defs>
    <!-- Brushed metal, matching --brushed in core.css so the favicon and the
         wordmark are cut from the same surface. -->
    <linearGradient id="brushed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="22%"  stop-color="#d8dbe3"/>
      <stop offset="48%"  stop-color="#9aa0ae"/>
      <stop offset="68%"  stop-color="#eef0f4"/>
      <stop offset="100%" stop-color="#b0b6c2"/>
    </linearGradient>

    <!-- Overhead light on the plate, so the black is not flat. -->
    <radialGradient id="plate" cx="34%" cy="18%" r="88%">
      <stop offset="0%"   stop-color="#20202a"/>
      <stop offset="58%"  stop-color="#101015"/>
      <stop offset="100%" stop-color="#07070a"/>
    </radialGradient>

    <!-- Specular edge along the top, as on a bevelled metal case. -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="40%"  stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#plate)"/>
  <rect width="64" height="64" rx="15" fill="url(#edge)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none"
        stroke="#ffffff" stroke-opacity=".16"/>

  <!-- Engine turning: fine concentric rings, the same motif as the hero plate.
       Faint enough to vanish at small sizes rather than turn into moiré. -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".05">
    <circle cx="32" cy="32" r="26"/>
    <circle cx="32" cy="32" r="21"/>
    <circle cx="32" cy="32" r="16"/>
  </g>

  <!-- The letter A, drawn rather than set in type: no font dependency, and the
       crossbar sits low so the counter stays open when it is 16px wide. -->
  <path d="M32 13.5 L45.5 50 L38.9 50 L36.2 42.2 L27.8 42.2 L25.1 50 L18.5 50 Z
           M29.6 36.9 L34.4 36.9 L32 29.6 Z"
        fill="url(#brushed)"/>

  <!-- One hairline under the mark: the rule that runs through the whole
       interface, and it makes the letter sit on something. -->
  <rect x="20" y="53.6" width="24" height="1.1" rx=".55"
        fill="#b9bec9" fill-opacity=".55"/>
</svg>
