<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ARV Coin">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7931a"/>
      <stop offset="55%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#6ee7ff"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7931a" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#f7931a" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7ff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#6ee7ff" stop-opacity=".95"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#05070d"/>
  <rect width="64" height="64" rx="15" fill="url(#g)" opacity=".14"/>

  <!-- Double helix: two strands crossing, with block rungs between them. -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M22 10 C 40 22, 40 42, 22 54" stroke="url(#s1)"/>
    <path d="M42 10 C 24 22, 24 42, 42 54" stroke="url(#s2)"/>
  </g>
  <g stroke="#ffb04d" stroke-width="2.4" stroke-linecap="round" opacity=".85">
    <line x1="26" y1="18" x2="38" y2="18"/>
    <line x1="30" y1="32" x2="34" y2="32"/>
    <line x1="26" y1="46" x2="38" y2="46"/>
  </g>
  <g stroke="#a5f0ff" stroke-width="2.4" stroke-linecap="round" opacity=".8">
    <line x1="28" y1="25" x2="36" y2="25"/>
    <line x1="28" y1="39" x2="36" y2="39"/>
  </g>
</svg>
