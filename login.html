<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — ARV Coin</title>
<meta name="theme-color" content="#05070d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/core.css">
<script src="arv-config.js"></script>
</head>
<body>

<canvas id="helix-canvas" aria-hidden="true"></canvas>
<div data-nav></div>

<main class="page wrap" style="max-width:440px;padding-top:var(--sp-8);padding-bottom:var(--sp-8)">
  <div class="card">
    <h1 style="font-size:1.5rem;margin-bottom:var(--sp-2)">Sign in</h1>
    <p class="small muted" style="margin-bottom:var(--sp-5)">
      Your portfolio, history and tax statement.
    </p>

    <form data-form class="stack">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
    </form>

    <div class="row" style="margin:var(--sp-4) 0">
      <div style="flex:1;height:1px;background:var(--glass-brd)"></div>
      <span class="tiny muted">or</span>
      <div style="flex:1;height:1px;background:var(--glass-brd)"></div>
    </div>

    <button class="btn btn-ghost btn-block" data-google>Continue with Google</button>

    <p class="small muted center" style="margin:var(--sp-5) 0 0">
      No account? <a href="signup.html">Create one</a>
    </p>

    <div class="note-box" style="margin-top:var(--sp-4)" data-local-note hidden>
      <strong>Running without a backend.</strong> Supabase is not configured, so
      accounts and holdings live in this browser only. Signing in with any email
      creates a local session. See <code>SETUP.md</code> to connect a real database.
    </div>
  </div>
</main>

<div data-footer></div>
<script type="module" src="js/pages/auth.js"></script>
</body>
</html>
