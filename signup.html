<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account — ARV Coin</title>
<meta name="theme-color" content="#05070d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/core.css">
<script src="arv-config.js"></script>
</head>
<body>

<canvas id="helix-canvas" aria-hidden="true"></canvas>
<div data-nav></div>

<main class="page wrap" style="max-width:440px;padding-top:var(--sp-7);padding-bottom:var(--sp-8)">
  <div class="card">
    <h1 style="font-size:1.5rem;margin-bottom:var(--sp-2)">Create an account</h1>
    <p class="small muted" style="margin-bottom:var(--sp-5)">
      Start from ₹100. Pay by UPI.
    </p>

    <form data-form class="stack">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name">
        <span class="hint">As it appears on your PAN, for the tax statement</span>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
        <span class="hint">At least 8 characters</span>
      </div>

      <label class="check">
        <input type="checkbox" required>
        <span>
          I have read the <a href="legal.html#risk" target="_blank" rel="noopener">risk
          disclosure</a> and <a href="legal.html#terms" target="_blank" rel="noopener">terms</a>,
          and I understand that ARV tracks Bitcoin and can fall in value.
        </span>
      </label>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
    </form>

    <p class="small muted center" style="margin:var(--sp-5) 0 0">
      Already registered? <a href="login.html">Sign in</a>
    </p>

    <div class="note-box" style="margin-top:var(--sp-4)" data-local-note hidden>
      <strong>Running without a backend.</strong> Supabase is not configured, so
      this account and its holdings will live in this browser only.
    </div>
  </div>
</main>

<div data-footer></div>
<script type="module" src="js/pages/auth.js"></script>
</body>
</html>
